server {
    listen 80;
    server_name techpuro.com www.techpuro.com;
    return 301 https://techpuro.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name techpuro.com;

    ssl_certificate     /etc/letsencrypt/live/techpuro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techpuro.com/privkey.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location /static/ {
        alias /var/www/techpuro/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
