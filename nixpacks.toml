[phases.setup]
nixPkgs = ["python312"]
aptPkgs = ["curl", "wget"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[start]
cmd = "gunicorn --bind 0.0.0.0:8000 --timeout 120 wsgi:app"
